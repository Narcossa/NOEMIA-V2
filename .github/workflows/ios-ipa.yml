# Fabrique le .ipa de NOÉMIA sur un Mac de GitHub, sans signature.
# SideStore / AltStore le signent ensuite avec l'identifiant Apple gratuit de chaque iPhone.
# Lancement : onglet « Actions » › « iPhone .ipa » › « Run workflow », ou en poussant un tag v0.1.0.
name: iPhone .ipa

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Projet iOS (avatar emballé + prebuild)
        run: npm run prebuild:ios

      - name: Compilation (sans signature)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS — scheme: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Paquet .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          VERSION=$(node -p "require('./app.json').expo.version")
          zip -qr "NOEMIA-$VERSION.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NOEMIA-ipa
          path: app/*.ipa
          retention-days: 30

      - name: Publication (tags uniquement)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/*.ipa
