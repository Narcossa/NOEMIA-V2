# Fabrique le .ipa de NOÉMIA sur un Mac de GitHub, sans signature.
# SideStore / AltStore le signent ensuite avec l'identifiant Apple gratuit de chaque iPhone.
# Lancement : onglet « Actions » › « iPhone .ipa » › « Run workflow », ou en poussant un tag v0.1.0.
name: iPhone .ipa

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # standard : appli + widget · complet : + « Partager » et Apple Watch
        variante: [standard, complet]
    env:
      NOEMIA_VARIANTE: ${{ matrix.variante }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Projet iOS (avatar emballé + prebuild)
        run: npm run prebuild:ios

      - name: Compilation (sans signature)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS — scheme: $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { tail -n 80 build.log; exit 1; }
          tail -n 20 build.log

      # En cas d'échec : les erreurs de compilation deviennent des annotations publiques,
      # lisibles sans compte GitHub (API check-runs), pour pouvoir les corriger vite.
      - name: Erreurs de compilation
        if: failure()
        run: |
          test -f build.log || exit 0
          grep -E "error: |BUILD FAILED|fatal error" build.log | sed -E 's#^.*/(app|ios|modules|targets|node_modules)/#\1/#' | sort -u | head -n 45 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Paquet .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          VERSION=$(node -p "require('./app.json').expo.version")
          SUFFIX=$([ "$NOEMIA_VARIANTE" = "complet" ] && echo "-complet" || echo "")
          zip -qr "NOEMIA$SUFFIX-$VERSION.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NOEMIA-ipa-${{ matrix.variante }}
          path: app/*.ipa
          retention-days: 30

      - name: Publication (tags uniquement)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/*.ipa
